[package]
name = "audiobookshelf"
version = "0.1.0"
edition = "2021"
description = "Audiobook + podcast server — orca service-backend"

[package.metadata.orca]
category = "media"

[lib]
name = "audiobookshelf"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "audiobookshelf"
path = "src/main.rs"

[dependencies]
plugin-toolkit = { git = "https://github.com/argyle-labs/orca", branch = "main", package = "orca-plugin-toolkit", default-features = false, features = ["tools", "db", "delegated-http"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt"] }

[lints.clippy]
let_underscore_must_use = "deny"
